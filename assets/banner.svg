<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060d"/>
      <stop offset="0.55" stop-color="#12102a"/>
      <stop offset="1" stop-color="#2b1220"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.72" r="0.65">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c23616" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c23616" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffd76a"/>
      <stop offset="0.7" stop-color="#e0a32e"/>
      <stop offset="1" stop-color="#8f5d14"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d00"/>
      <stop offset="0.5" stop-color="#ff8c00"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6472"/>
      <stop offset="0.5" stop-color="#2e343d"/>
      <stop offset="1" stop-color="#181c22"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="fog" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="480" fill="url(#bg)"/>
  <ellipse cx="640" cy="352" rx="800" ry="250" fill="url(#horizon)"/>

  <!-- 星点 -->
  <g fill="#cfd8ff" opacity="0.45">
    <circle cx="96" cy="52" r="1.6"/>
    <circle cx="210" cy="88" r="1.2"/>
    <circle cx="342" cy="42" r="1.8"/>
    <circle cx="452" cy="70" r="1.1"/>
    <circle cx="578" cy="36" r="1.5"/>
    <circle cx="708" cy="62" r="1.3"/>
    <circle cx="832" cy="30" r="1.7"/>
    <circle cx="952" cy="78" r="1.2"/>
    <circle cx="1084" cy="48" r="1.6"/>
    <circle cx="1196" cy="84" r="1.3"/>
    <circle cx="150" cy="130" r="1"/>
    <circle cx="760" cy="112" r="1"/>
    <circle cx="1030" cy="120" r="1.1"/>
  </g>

  <!-- 远山剪影 -->
  <path d="M0 330 L140 272 L260 312 L380 252 L520 322 L660 262 L800 318 L940 258 L1080 312 L1280 268 L1280 480 L0 480 Z" fill="#0d0f1c" opacity="0.95"/>
  <path d="M0 356 L200 316 L360 348 L560 306 L760 350 L980 312 L1280 348 L1280 480 L0 480 Z" fill="#080a12"/>

  <!-- 地面 -->
  <rect x="0" y="372" width="1280" height="108" fill="#05060c"/>

  <!-- 远处烟雾 -->
  <g fill="#3a2b3f" opacity="0.35" filter="url(#fog)">
    <ellipse cx="320" cy="372" rx="200" ry="40"/>
    <ellipse cx="900" cy="374" rx="240" ry="44"/>
  </g>

  <!-- 左侧火焰 -->
  <g transform="translate(150,0)">
    <path d="M60 372 Q38 308 72 262 Q84 240 78 216 Q94 250 104 272 Q136 302 116 372 Z" fill="url(#fire)" opacity="0.9"/>
    <path d="M78 372 Q60 322 88 284 Q100 266 96 248 Q112 276 118 298 Q142 326 124 372 Z" fill="#ffd23f" opacity="0.95"/>
    <ellipse cx="92" cy="360" rx="70" ry="34" fill="#ff7a18" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- 右侧主坦克剪影（面向左） -->
  <g transform="translate(1010,236)">
    <ellipse cx="-10" cy="92" rx="130" ry="36" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <rect x="-70" y="70" width="160" height="42" rx="11" fill="#0c0e15"/>
    <path d="M-78 70 L-60 38 L64 38 L80 70 Z" fill="#11141d"/>
    <rect x="-24" y="12" width="66" height="32" rx="11" fill="#161a26"/>
    <rect x="-128" y="23" width="108" height="11" rx="5" fill="url(#steel)"/>
    <rect x="-128" y="23" width="108" height="4" rx="2" fill="#3d4550" opacity="0.8"/>
    <circle cx="-140" cy="28" r="15" fill="#ff8c00" opacity="0.75" filter="url(#soft)"/>
    <circle cx="-140" cy="28" r="7" fill="#ffd23f" opacity="0.95"/>
  </g>

  <!-- 左侧小坦克剪影（面向右） -->
  <g transform="translate(400,306)">
    <rect x="-48" y="42" width="104" height="28" rx="8" fill="#0c0e15"/>
    <path d="M-56 42 L-42 22 L42 22 L56 42 Z" fill="#11141d"/>
    <rect x="-14" y="8" width="42" height="20" rx="8" fill="#161a26"/>
    <rect x="24" y="14" width="72" height="8" rx="4" fill="url(#steel)"/>
  </g>

  <!-- 弹道线装饰 -->
  <g stroke="#ffd76a" stroke-width="1.6" opacity="0.28" stroke-dasharray="7 9">
    <line x1="330" y1="330" x2="520" y2="290"/>
    <line x1="880" y1="330" x2="1080" y2="290"/>
  </g>
  <g fill="#ffd76a" opacity="0.4">
    <circle cx="340" cy="328" r="3"/>
    <circle cx="870" cy="328" r="3"/>
  </g>

  <!-- 标题装饰线 -->
  <g stroke="#e0a32e" stroke-width="2" opacity="0.85">
    <line x1="352" y1="118" x2="508" y2="118"/>
    <line x1="772" y1="118" x2="928" y2="118"/>
  </g>
  <g fill="#e0a32e" opacity="0.9">
    <rect x="343" y="109" width="18" height="18" transform="rotate(45 352 118)"/>
    <rect x="919" y="109" width="18" height="18" transform="rotate(45 928 118)"/>
  </g>

  <!-- 主标题 -->
  <text x="640" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="96" font-weight="900" fill="url(#titleGold)" filter="url(#glow)" letter-spacing="16">钢铁前线</text>
  <text x="640" y="246" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#9fb4d8" letter-spacing="14">I R O N &nbsp;F R O N T I E R</text>

  <!-- 特性标签 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="700">
    <rect x="176" y="306" width="152" height="46" rx="23" fill="#16233f" stroke="#3d5a99" stroke-width="1.5"/>
    <text x="252" y="335" text-anchor="middle" fill="#cfe0ff">三种模式</text>
    <rect x="348" y="306" width="152" height="46" rx="23" fill="#16233f" stroke="#3d5a99" stroke-width="1.5"/>
    <text x="424" y="335" text-anchor="middle" fill="#cfe0ff">12 款皮肤</text>
    <rect x="520" y="306" width="152" height="46" rx="23" fill="#16233f" stroke="#3d5a99" stroke-width="1.5"/>
    <text x="596" y="335" text-anchor="middle" fill="#cfe0ff">金币经济</text>
    <rect x="692" y="306" width="152" height="46" rx="23" fill="#16233f" stroke="#3d5a99" stroke-width="1.5"/>
    <text x="768" y="335" text-anchor="middle" fill="#cfe0ff">零依赖</text>
    <rect x="864" y="306" width="240" height="46" rx="23" fill="#3a2a08" stroke="#e0a32e" stroke-width="1.5"/>
    <text x="984" y="335" text-anchor="middle" fill="#ffd76a">福利码 langjianer666</text>
  </g>

  <!-- 底部技术标签 -->
  <g>
    <rect x="508" y="382" width="264" height="32" rx="16" fill="none" stroke="#3d5a99" stroke-width="1.2"/>
    <text x="640" y="403" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#7a93c9" letter-spacing="4">HTML5 CANVAS · 60 FPS</text>
  </g>
</svg>
